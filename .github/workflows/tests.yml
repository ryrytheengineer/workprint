# Runs the test suite on the three supported operating systems.
# Linux, macOS and Windows, Python 3.10 and 3.13. The optional models are not downloaded here;
# the tests that need them skip.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - run: python -m pip install -e ".[dev,timeline]"
      - run: python -m workprint doctor
      - run: python -m pytest -q
      - name: Plugin launcher installs from a clean checkout
        run: python scripts/workprint.py --version
