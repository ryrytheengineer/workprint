[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workprint"
version = "0.7.0"
description = "A cinematic editing engine for Claude Code: footage, music and a brief in, a finished film and an editable cut out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Motion & Matter" }]
keywords = ["video", "editing", "film", "claude-code", "ffmpeg"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
timeline = ["opentimelineio>=0.17"]
voice = ["pocketsphinx>=5.0", "sherpa-onnx>=1.10"]
matte = ["onnxruntime>=1.16"]
dev = ["pytest>=7"]

[project.scripts]
workprint = "workprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workprint = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
